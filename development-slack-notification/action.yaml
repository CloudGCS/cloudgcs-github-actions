name: "Slack Notification"
description: "Send a development notification to Slack"

inputs:
  slack-bot-token:
    description: "Slack bot token"
    required: true
  slack-channel-id:
    description: "Slack channel ID"
    required: true
  author:
    description: "Version info"
    required: true
  change-log-file-full-path:
    description: "Change log file path"
    required: true

runs:
  using: "composite"
  steps:
    # 🔥 CHANGELOG OKU + SPLIT
    - name: Read and split changelog
      id: changelog
      shell: bash
      run: |
        FILE="${{ inputs.change-log-file-full-path }}"

        CONTENT=$(cat "$FILE")

        echo "part1<<EOF" >> $GITHUB_OUTPUT
        echo "$CONTENT" | head -c 2900 >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

        echo "part2<<EOF" >> $GITHUB_OUTPUT
        echo "$CONTENT" | tail -c +2901 | head -c 2900 >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    # 🔥 SLACK MESAJI
    - name: Send to Slack
      uses: slackapi/slack-github-action@v2.0.0
      with:
        method: chat.postMessage
        token: ${{ inputs.slack-bot-token }}
        payload: |
          {
            "channel": "${{ inputs.slack-channel-id }}",
            "text": "New release notification",

            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "New release for ${{ github.repository }}"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "_Author: ${{ inputs.author }}_"
                }
              },
              {
                "type": "divider"
              },

              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "${{ steps.changelog.outputs.part1 }}"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "${{ steps.changelog.outputs.part2 }}"
                }
              }
            ]
          }
